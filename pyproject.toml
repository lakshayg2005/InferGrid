[project]
name = "infergrid"
version = "0.1.0"
description = "A distributed LLM serving platform with cache-aware routing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# For infergrid.queue.redpanda.RedpandaClient -- a real Kafka-API broker backend,
# not exercised by this project's tests (see that module's docstring).
kafka = ["aiokafka>=0.11"]

[tool.setuptools.packages.find]
# Without this, setuptools' auto-discovery sees bench/ (benchmark and chaos-test
# results) as a second top-level package alongside infergrid/ and refuses to guess
# which one is the real package.
include = ["infergrid*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
